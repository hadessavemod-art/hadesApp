<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HadesSave — Архив</title>
    <link rel="stylesheet" href="mini-app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .hidden { display: none !important; }
        .list-container { display: flex; flex-direction: column; gap: 10px; padding: 15px; }
        .list-item { background: #1c1c1e; padding: 15px; border-radius: 12px; cursor: pointer; border-left: 3px solid #007aff; }
        .list-item:active { background: #2c2c2e; }
        .list-item-title { font-weight: bold; color: #fff; margin-bottom: 5px; font-size: 16px;}
        .list-item-sub { font-size: 12px; color: #8e8e93; }
        
        .message-item { background: #1c1c1e; padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid #007aff; }
        .message-item.deleted { border-left-color: #ff453a; opacity: 0.8; }
        .message-item.edited { border-left-color: #ffcc00; }
        .msg-author { font-size: 12px; color: #007aff; margin-bottom: 5px; font-weight: bold; }
        .msg-text { font-size: 14px; color: #fff; word-break: break-word; margin-bottom: 8px;}
        .msg-time { font-size: 10px; color: #8e8e93; margin-top: 5px; text-align: right; }
        .header-btn { background: none; border: none; color: #007aff; font-size: 16px; cursor: pointer; padding: 0; }
        
        /* Стили для медиа */
        .msg-media { max-width: 100%; border-radius: 8px; display: block; margin-top: 5px; }
        .msg-sticker { width: 120px; height: 120px; object-fit: contain; display: block; }
        .msg-video-note { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; display: block; }
        .msg-audio { width: 100%; max-width: 250px; margin-top: 5px; outline: none; }
        .msg-doc { display: inline-block; background: #2c2c2e; padding: 8px 12px; border-radius: 8px; color: #007aff; text-decoration: none; font-size: 14px; margin-top: 5px;}
    </style>
</head>
<body class="mini-app-body">
    <div id="app" class="hs-app">
        <header class="hs-topbar">
            <button id="btn-back" class="header-btn">‹ Назад</button>
            <div>
                <strong id="header-title">Статистика</strong>
                <small>HadesSave</small>
            </div>
            <div class="hs-topbar-spacer"></div>
        </header>

        <main class="hs-content">
            <div id="loading" class="hs-state">
                <div class="hs-loader"></div>
                <strong>Загрузка...</strong>
                <p>Получаем данные из архива</p>
            </div>

            <div id="error" class="hs-state hidden">
                <span class="hs-state__icon">⚠️</span>
                <strong>Ошибка</strong>
                <p id="error-text"></p>
                <button onclick="location.reload()">Попробовать снова</button>
            </div>

            <div id="view-stats" class="hs-page hidden">
                <div class="hs-welcome" style="padding: 15px;">
                    <small>Привет,</small>
                    <h1 id="user-name">Пользователь</h1>
                </div>

                <div class="hs-stat-grid hs-stat-grid--wide" style="padding: 0 15px;">
                    <article data-tone="blue" id="card-messages" style="cursor: pointer;">
                        <span data-tone="blue">💬</span>
                        <strong id="total-messages">0</strong>
                        <small>Сообщений (Нажми)</small>
                    </article>
                    <article data-tone="red">
                        <span data-tone="red">🗑</span>
                        <strong id="deleted-messages">0</strong>
                        <small>Удалённых</small>
                    </article>
                </div>
            </div>

            <div id="view-chats" class="hs-page hidden">
                <div class="list-container" id="chats-list"></div>
            </div>

            <div id="view-messages" class="hs-page hidden">
                <div class="list-container" id="messages-list"></div>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
